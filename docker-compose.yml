# docker compose up --build              the app and the language model
# docker compose --profile https up      adds Caddy for HTTPS (set DOMAIN)
# Monitoring has its own file, because Grafana insists on a password:
#   GRAFANA_PASSWORD=... docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d
#
# Download the models first: python scripts/fetch_models.py --profile cpu
services:
  llm:
    build:
      context: .
      dockerfile: infrastructure/docker/llama.Dockerfile
    command:
      - --model
      - /models/llm/Qwen3.5-0.8B-Q4_K_M.gguf
      - --host
      - 0.0.0.0
      - --port
      - "8081"
      - --ctx-size
      - "2048"
      - --threads
      - "4"
      - --parallel
      - "1"
    volumes:
      - ./models:/models:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/health"]
      interval: 20s
      timeout: 5s
      start_period: 60s
      retries: 5

  app:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
    env_file: .env
    environment:
      VAP_LLM_BASE_URL: http://llm:8081/v1
      VAP_LLM_MANAGE_PROCESS: "false"
      VAP_METRICS_OPEN: "true"   # the port is local only, and Caddy refuses /metrics from outside
      VAP_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./models:/app/models:ro
      - voice-data:/app/data
    depends_on:
      llm:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2.8-alpine
    profiles: [https]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [app]
    restart: unless-stopped

volumes:
  voice-data:
  caddy-data:
